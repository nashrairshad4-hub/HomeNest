{% extends 'base.html' %}

{% block title %}Page Not Found — HomeNest{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
    <div class="max-w-700 mx-auto bg-white p-5 rounded-4 shadow-sm border">
        <h1 class="display-1 font-playfair fw-bold text-primary mb-3">404</h1>
        <h3 class="font-playfair fw-bold mb-3">Property or Page Not Found</h3>
        <p class="text-muted mb-4">The property listing or URL you are looking for may have been sold, removed, or temporarily unavailable.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary-custom rounded-pill px-4">
                <i class="fa-solid fa-house me-1"></i> Return Home
            </a>
            <a href="{{ url_for('properties.list_properties') }}" class="btn btn-outline-primary rounded-pill px-4">
                Browse Properties
            </a>
        </div>
    </div>
</div>
{% endblock %}
