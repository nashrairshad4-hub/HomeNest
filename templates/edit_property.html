{% extends 'base.html' %}

{% block title %}Edit Property Listing — HomeNest{% endblock %}

{% block content %}
<div class="page-header-banner bg-dark text-white py-4">
    <div class="container py-2">
        <h2 class="font-playfair fw-bold text-white mb-1">Edit Listing: {{ property.title }}</h2>
        <p class="text-white-50 small mb-0">Update price, description, images or listing status.</p>
    </div>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm border">
                <form action="{{ url_for('properties.edit_property', property_id=property.id) }}" method="POST" enctype="multipart/form-data">
                    
                    <div class="row g-3 mb-4">
                        <div class="col-12">
                            <label class="form-label fw-semibold text-dark">Property Title</label>
                            <input type="text" name="title" class="form-control" value="{{ property.title }}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold text-dark">Property Type</label>
                            <select name="property_type" class="form-select" required>
                                <option value="House" {% if property.property_type == 'House' %}selected{% endif %}>House</option>
                                <option value="Villa" {% if property.property_type == 'Villa' %}selected{% endif %}>Luxury Villa</option>
                                <option value="Apartment" {% if property.property_type == 'Apartment' %}selected{% endif %}>Apartment</option>
                                <option value="Penthouse" {% if property.property_type == 'Penthouse' %}selected{% endif %}>Penthouse</option>
                                <option value="Commercial" {% if property.property_type == 'Commercial' %}selected{% endif %}>Commercial Property</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold text-dark">Price (PKR)</label>
                            <input type="number" name="price" class="form-control" value="{{ property.price|int }}" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-semibold text-dark">Status</label>
                            <select name="status" class="form-select" required>
                                <option value="Available" {% if property.status == 'Available' %}selected{% endif %}>Available for Sale</option>
                                <option value="Sold" {% if property.status == 'Sold' %}selected{% endif %}>Sold</option>
                                <option value="Pending" {% if property.status == 'Pending' %}selected{% endif %}>Pending Deal</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Location / City</label>
                            <input type="text" name="location" class="form-control" value="{{ property.location }}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Exact Address</label>
                            <input type="text" name="address" class="form-control" value="{{ property.address }}" required>
                        </div>

                        <div class="col-md-3 col-6">
                            <label class="form-label fw-semibold text-dark">Bedrooms</label>
                            <input type="number" name="bedrooms" class="form-control" value="{{ property.bedrooms }}" min="1" required>
                        </div>

                        <div class="col-md-3 col-6">
                            <label class="form-label fw-semibold text-dark">Bathrooms</label>
                            <input type="number" name="bathrooms" class="form-control" value="{{ property.bathrooms }}" min="1" required>
                        </div>

                        <div class="col-md-3 col-6">
                            <label class="form-label fw-semibold text-dark">Area Size</label>
                            <input type="text" name="area" class="form-control" value="{{ property.area }}" required>
                        </div>

                        <div class="col-md-3 col-6">
                            <label class="form-label fw-semibold text-dark">Year Built</label>
                            <input type="number" name="year_built" class="form-control" value="{{ property.year_built }}">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold text-dark">Description</label>
                            <textarea name="description" rows="5" class="form-control" required>{{ property.description }}</textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Main Image URL</label>
                            <input type="url" name="image_url" class="form-control" value="{{ property.image }}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-dark">Replace Photo via File Upload</label>
                            <input type="file" name="image_file" class="form-control" accept="image/*">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between pt-3 border-top">
                        <a href="{{ url_for('auth.dashboard') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary-custom rounded-pill px-5 fw-bold">
                            Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
